version: "3.8"

services:
  # ============== Redis：会话上下文 ==============
  redis:
    image: redis:7-alpine
    container_name: helix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - helix-redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-helix123}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-helix123}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============== MySQL：长期记忆持久化 ==============
  mysql:
    image: mysql:8.0
    container_name: helix-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: helix_db
      MYSQL_USER: helix
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-helix123}
      TZ: Asia/Shanghai
    volumes:
      - helix-mysql-data:/var/lib/mysql
      # 可选：首次启动自动建表（后续写 migrations/init.sql 挂这里）
      # - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uhelix", "-phelix123"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============== Qdrant：向量检索 ==============
  qdrant:
    image: qdrant/qdrant:v1.9
    container_name: helix-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"     # HTTP API（Python SDK 走这个）
      - "6334:6334"     # gRPC（可选，高性能场景用）
    volumes:
      - helix-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/collections"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  helix-redis-data:
  helix-mysql-data:
  helix-qdrant-data: